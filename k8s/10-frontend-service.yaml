# NodePort : seule porte d'entree depuis l'exterieur du cluster.
# Le port 30080 est ouvert sur le noeud -> http://localhost:30080
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: frontend
spec:
  type: NodePort
  selector:
    app: bijouterie
    tier: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
