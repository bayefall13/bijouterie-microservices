# ClusterIP : l'API n'est appelee que par le frontend, via http://backend:3000.
# Le Service repartit les requetes entre les 2 pods (champ servedBy de /api/config).
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: bijouterie
    tier: backend
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
