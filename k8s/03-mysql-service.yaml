# ClusterIP : la base n'est joignable que depuis l'interieur du cluster.
# Le nom "mysql" est resolu par le DNS du cluster, d'ou DB_HOST=mysql.
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: database
spec:
  type: ClusterIP
  selector:
    app: bijouterie
    tier: database
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
